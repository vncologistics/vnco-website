    header_logo_alt: "VNCO logo"
    footer_logo: "/images/Frame-8@2x.png"
    footer_logo_alt: "VNCO footer logo"
    eyebrow: "TRANSPORT & LOGISTICS"
    tagline: "Transport and logistics, with a personal touch."
    sub_label: "VNCO / TRANSPORT AND LOGISTICS"
    mobile_tagline: "Connecting your business to its next destination."
    copyright: "Copyright © VNCO L.L.C"
  contact:
    email: "Rick@vncologistics.com"
    phone_display: "+1 (239) 203 1761"
    phone_href: "+12392031761"
    address: "Av. del Transporte 123, 28001 Florida, US"

